name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: ci-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Lint with Ruff
        run: |
          ruff check --ignore N999 Settings manage.py start.py

      - name: Check formatting with Ruff
        run: |
          ruff format --check Settings manage.py start.py

      - name: Django system check
        run: |
          python manage.py check

      - name: Django deployment check
        run: |
          python manage.py check --deploy

      - name: Run tests
        run: |
          python manage.py test --verbosity 2

      - name: Compile Python sources
        run: |
          python -m compileall Settings Swiggy CustomerSupport manage.py start.py

      - name: Dependency audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Security scan with Bandit
        continue-on-error: true
        run: |
          bandit -q -r Settings Swiggy CustomerSupport start.py manage.py

      - name: Docker build validation
        run: |
          docker build --pull --no-cache -t swiggy-ci:${{ github.sha }} .
